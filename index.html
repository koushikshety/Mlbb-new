<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLBB Draft Companion</title>
  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      color: #38bdf8;
      margin-top: 0;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #0ea5e9;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0284c7;
    }
    #output {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🛡️ MLBB Draft Companion</h2>
    
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Enter your Gemini API key" />

    <label for="heroInput">Your Hero</label>
    <input type="text" id="heroInput" placeholder="e.g., Angela, Fanny, Tigreal" />

    <label for="imageInput">Upload Draft / Pick Screenshot</label>
    <input type="file" id="imageInput" accept="image/*" />

    <button id="analyzeBtn">Analyze Draft & Get Build</button>
  </div>

  <div class="card" id="resultCard" style="display: none;">
    <h3>Analysis & Recommendation</h3>
    <div id="output">Preparing analysis...</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
