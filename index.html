<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB AI Draft Companion</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: var(--accent-color);
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="text"], input[type="file"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      border: none;
      border-radius: 6px;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #64748b;
    }
    #output {
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
  <!-- Google Gen AI SDK -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <h2>🛡️ MLBB Draft Companion</h2>

    <div class="card">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your Gemini API key">
      
      <label for="heroInput">Your Hero</label>
      <input type="text" id="heroInput" placeholder="e.g., Suyou, Ling, Tigreal">
      
      <label for="imageInput">Upload Draft / Pick Screenshot</label>
      <input type="file" id="imageInput" accept="image/*">

      <button id="analyzeBtn">Analyze Draft & Get Build</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
      <h3>Analysis & Recommendation</h3>
      <div id="output">Processing...</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
